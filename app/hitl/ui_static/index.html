<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f8f6" />
    <title>Wind Phase Review Lab</title>
    <!-- Bump both asset versions together when updating the UI. -->
    <link rel="stylesheet" href="/static/styles.css?v=20261013-ui4" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-label="Wind forecast conversation">
        <header class="topbar">
          <div class="brand">
            <span class="mark" aria-hidden="true">
              <svg width="29" height="29" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round">
                <path d="M5 11h15a4 4 0 1 0-4-4M5 17h20a3 3 0 1 0-3-3M5 23h10a3 3 0 1 1-3 3" />
              </svg>
            </span>
            <div>
              <h1>Wind Phase Review Lab</h1>
              <p class="subtitle">KBOS Wind State Review</p>
            </div>
          </div>
          <span id="llmStatus" class="model-status">Loading explanation mode...</span>
        </header>
        <p id="metadataStatus" class="data-caption">Loading observation context...</p>

        <section id="messages" class="messages is-empty" aria-label="Conversation" aria-live="polite">
          <div id="welcomeState" class="welcome">
            <p class="welcome-label">Wind, with context.</p>
            <h2>Explore the next wind phase.</h2>
            <p>Start with a phase forecast, then explore its evidence.</p>
          </div>
        </section>

        <footer class="composer-area">
          <div class="prompt-suggestions" aria-label="Example prompts">
            <span class="hint-label">Try asking</span>
            <button id="promptSuggestion" class="suggestion-button" type="button" title="Use this example prompt">
              <span id="promptSuggestionText">Predict the next wind phase</span>
            </button>
            <button id="pauseSuggestions" class="pause-button" type="button" aria-label="Pause prompt suggestions" aria-pressed="false" title="Pause examples">
              <svg class="pause-icon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                <path d="M7 5v10M13 5v10" />
              </svg>
              <svg class="play-icon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linejoin="round" aria-hidden="true">
                <path d="m7 5 8 5-8 5Z" />
              </svg>
            </button>
          </div>
          <form id="chatForm" class="composer">
            <textarea id="question" rows="2" maxlength="1500" aria-label="Your question" placeholder="Ask about the wind forecast or its evidence..."></textarea>
            <button id="sendButton" class="send-button" type="submit" aria-label="Send question" title="Send question">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5m-6 6 6-6 6 6" />
              </svg>
            </button>
          </form>
        </footer>
      </section>
    </main>
    <script src="/static/app.js?v=20261013-ui4"></script>
  </body>
</html>
