<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="636" viewBox="0 0 1240 636" role="img" aria-labelledby="title description">
  <title id="title">Wind Phase Review Lab pipeline</title>
  <desc id="description">A user question enters the LangGraph router. New tasks use compact wind summaries from a saved snapshot and historical data to forecast the next phase, explain the current state, or retrieve similar past windows. Results and evidence go to the LLM through LangChain, and the answer appears in chat. Clarification questions can reuse previous results from session memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1240" height="636" fill="#fff"/>

  <!-- A conventional flowchart: plain rectangles, orthogonal arrows, no effects. -->
  <g fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 210 353 H 250"/>
    <path d="M 460 353 H 508"/>
    <path d="M 752 353 H 800"/>
    <path d="M 990 353 H 1030"/>
    <path d="M 630 108 V 150"/>
    <path d="M 630 228 V 294"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)">
    <path d="M 355 412 V 520"/>
    <path d="M 460 564 H 895 V 412"/>
  </g>

  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="508" y="30" width="244" height="78"/>
    <rect x="508" y="150" width="244" height="78"/>
    <rect x="36" y="294" width="174" height="118"/>
    <rect x="250" y="294" width="210" height="118"/>
    <rect x="508" y="294" width="244" height="118"/>
    <rect x="800" y="294" width="190" height="118"/>
    <rect x="1030" y="294" width="174" height="118"/>
    <rect x="250" y="520" width="210" height="88"/>
  </g>

  <g fill="#000" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="22">
      <text x="630" y="61">Wind data</text>
      <text x="630" y="181">Compact summaries</text>
      <text x="123" y="344">User</text>
      <text x="123" y="373">question</text>
      <text x="355" y="344">Request router</text>
      <text x="630" y="324">Wind tasks</text>
      <text x="895" y="344">LLM explanation</text>
      <text x="1117" y="344">Answer</text>
      <text x="355" y="555">Session memory</text>
    </g>
    <g font-size="18">
      <text x="630" y="87">Snapshot + history</text>
      <text x="630" y="207">Features + pattern labels</text>
      <text x="355" y="373">LangGraph</text>
      <text x="630" y="353">Next phase / current state</text>
      <text x="630" y="382">Similar past windows</text>
      <text x="895" y="373">LangChain</text>
      <text x="1117" y="373">in chat</text>
      <text x="355" y="582">Previous results</text>
      <text x="484" y="279">New task</text>
      <text x="776" y="279">Evidence</text>
      <text x="369" y="472" text-anchor="start">Follow-up</text>
      <text x="677" y="548">Stored results</text>
    </g>
  </g>
</svg>
